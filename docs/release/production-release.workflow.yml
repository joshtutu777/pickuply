# DRAFT ONLY. This file is not in .github/workflows, so GitHub Actions will not run it.
# Do not install it until the production environment requires a reviewer other than the person who started the run.
# Keep the Vercel Git integration disconnected. This workflow deploys with the CLI.
# This file contains no credentials.
# The job deploys at most once. It does not retry, roll back, promote, or edit scripts/approved-release.json.
# The job must not apply database migrations. The release guard rejects migration changes.
# After a verified deployment, a later commit may update only scripts/approved-release.json.
# Check that commit with: node scripts/release-guard.mjs --record
# That check does not deploy, and the release guard still refuses the record change as a release.

name: Production release

"on":
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main commit to release
        required: true
        type: string
      approval:
        description: Type approved to deploy after the guards pass
        required: true
        default: checks-only
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the commit id and approval word
        env:
          SHA: ${{ inputs.sha }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          node --input-type=module -e "const sha=process.env.SHA??''; const approval=process.env.APPROVAL??''; if(!/^[0-9a-f]{40}$/.test(sha)||(approval!=='approved'&&approval!=='checks-only')) process.exit(1);"

  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Confirm the commit is the current main tip
        env:
          SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "if(!/^[0-9a-f]{40}$/.test(process.env.SHA??'')) process.exit(1);"
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SHA"

      - name: Run the release guards
        run: node scripts/release-guard.mjs --full
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy the reviewed commit once
        id: deploy
        if: inputs.approval == 'approved'
        env:
          SHA: ${{ inputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          npx --yes vercel deploy . --prod --yes --scope pickuply-app --project pickuply --meta "gitCommitSha=${SHA}" --meta "gitCommitRef=main" >"$RUNNER_TEMP/deploy-out.txt" 2>"$RUNNER_TEMP/deploy-err.txt"
          deploy_code=$?
          node scripts/release-deploy-report.mjs target --stdout "$RUNNER_TEMP/deploy-out.txt" --stderr "$RUNNER_TEMP/deploy-err.txt" >"$RUNNER_TEMP/deploy-target.txt"
          target=$(tr -d '\r\n' < "$RUNNER_TEMP/deploy-target.txt")
          inspect_code=1
          if [ -n "$target" ]; then
            npx --yes vercel inspect "$target" --scope pickuply-app --json >"$RUNNER_TEMP/inspect.json" 2>"$RUNNER_TEMP/inspect-err.txt"
            inspect_code=$?
          fi
          node scripts/release-guard.mjs --production-json >"$RUNNER_TEMP/live.json" 2>"$RUNNER_TEMP/live-err.txt"
          node scripts/release-deploy-report.mjs report --deploy-stdout "$RUNNER_TEMP/deploy-out.txt" --deploy-stderr "$RUNNER_TEMP/deploy-err.txt" --deploy-exit "$deploy_code" --inspect "$RUNNER_TEMP/inspect.json" --inspect-exit "$inspect_code" --live "$RUNNER_TEMP/live.json" --approved scripts/approved-release.json --expected-sha "$SHA"
          report_code=$?
          exit "$report_code"

      - name: Show the record for the follow-up commit
        if: success() && inputs.approval == 'approved'
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment-id }}
          SHA: ${{ inputs.sha }}
        run: node scripts/release-deploy-report.mjs record
