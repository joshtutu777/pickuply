# DRAFT ONLY. This file is not in .github/workflows, so GitHub Actions will not run it.
# Do not install it until GitHub's production environment requires a reviewer.
# Keep the Vercel Git integration disconnected. This workflow deploys with the CLI.
# This file contains no credentials.
# The deploy job must not edit scripts/approved-release.json. A deployment does not approve itself.
# The job must not run supabase db push. The release guard rejects migration changes.
# After the deployment is verified, a later commit may update only scripts/approved-release.json.
# Check that commit with: node scripts/release-guard.mjs --record
# That check does not deploy, and the release guard still refuses the record change as a release.

name: Production release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main commit to release
        required: true
        type: string
      approval:
        description: Type approved to deploy after the guards pass
        required: true
        default: checks-only
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Confirm the commit is the current main tip
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ inputs.sha }}"

      - name: Run the release guards
        run: node scripts/release-guard.mjs --full
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy the validated commit
        id: deploy
        if: inputs.approval == 'approved'
        env:
          SHA: ${{ inputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx vercel deploy . --prod --yes --scope pickuply-app --project pickuply --meta "gitCommitSha=${SHA}" --meta "gitCommitRef=main")
          node --input-type=module -e "let s=''; for await (const c of process.stdin) s += c; const text=s.replace(/^\uFEFF/, ''); const value=JSON.parse(text.slice(text.search(/[\[{]/))); const sha=value.meta?.gitCommitSha ?? ''; const aliases=Array.isArray(value.alias)?value.alias:[]; if (value.readyState!=='READY' || value.target!=='production' || !aliases.includes('pickuplyapp.com') || sha!==process.env.SHA || !String(value.id??'').startsWith('dpl_')) process.exit(1); process.stdout.write(value.id);" <<< "$(npx vercel inspect "$url" --scope pickuply-app --json)" > deployment-id.txt
          echo "deployment-id=$(cat deployment-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Show the record for the follow-up commit
        if: inputs.approval == 'approved'
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment-id }}
          SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "const deploymentId=process.env.DEPLOYMENT_ID; const sha=process.env.SHA; if(!deploymentId?.startsWith('dpl_')||!/^[0-9a-f]{40}$/.test(sha??'')) process.exit(1); const record={repository:'joshtutu777/pickuply',branch:'main',sha,deploymentId}; console.log(JSON.stringify(record,null,2));"
          printf '\n%s\n' "Do not deploy the follow-up commit. Commit only scripts/approved-release.json with this SHA and deployment ID, then run node scripts/release-guard.mjs --record." >> "$GITHUB_STEP_SUMMARY"
